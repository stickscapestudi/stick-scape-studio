services:
  # Fullstack Web Service (Serves React Vite SPA + Express API on single domain)
  - type: web
    name: stick-scape-studio
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm --prefix server install && npm run db:generate && npm run db:push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: stick-scape-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@stickscape.com
      - key: ADMIN_PASSWORD
        value: AdminPass123!
      - key: VITE_ADMIN_MOBILE
        value: "8754132491"

databases:
  # Managed PostgreSQL Database
  - name: stick-scape-db
    plan: free
    region: singapore
    databaseName: stickscapestudio
    user: stickscape
